services:
  browser:
    build:
      context: .
      dockerfile: deploy/Dockerfile.browser
    image: remote-browser-chromium:local
    init: true
    restart: unless-stopped
    # Chromium keeps its namespace sandbox enabled. Standard Docker seccomp otherwise blocks
    # creation of the nested sandbox namespaces; do not replace this with --no-sandbox.
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
    cap_drop:
      - ALL
    environment:
      BROWSER_PROFILE_DIR: /tmp/browser-profile
      TZ: ${TZ:-Etc/UTC}
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g,uid=10001,gid=10001,mode=1777
    shm_size: 1gb
    volumes:
      - runtime-data:/runtime
    networks:
      - browser
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9222/json/version"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    stop_grace_period: 15s

  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
    image: remote-browser-gateway:local
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      browser:
        condition: service_healthy
    environment:
      BROWSER_CDP_URL: http://browser:9222
      BROWSER_CDP_TIMEOUT_MS: "30000"
      CHROME_USER_DATA_DIR: /runtime/gateway
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: "3000"
      MIRROR_ACCESS_PASSWORD: ${MIRROR_ACCESS_PASSWORD:?Set MIRROR_ACCESS_PASSWORD in .env}
      MIRROR_ACCESS_SECRET: ${MIRROR_ACCESS_SECRET:-}
      MIRROR_AUTH_SECRET: ${MIRROR_AUTH_SECRET:-}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "${REMOTE_BROWSER_BIND:-127.0.0.1}:${REMOTE_BROWSER_PORT:-8080}:3000"
    volumes:
      - runtime-data:/runtime
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=1777
    networks:
      - browser
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>{if(!x.ok||!x.browser)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 20s

networks:
  browser:
    driver: bridge

volumes:
  runtime-data:
